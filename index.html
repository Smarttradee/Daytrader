<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        background:#ffffff;
        font-family:Arial, sans-serif;
        flex-direction:column;
    }

    .loader{
        width:60px;
        height:60px;
        border:6px solid #e5e5e5;
        border-top:6px solid #007BFF;
        border-radius:50%;
        animation:spin .8s linear infinite;
    }

    p{
        margin-top:20px;
        color:#555;
        font-size:18px;
    }

    @keyframes spin{
        100%{
            transform:rotate(360deg);
        }
    }
</style>

</head>
<body>

<div class="loader"></div>
<p>Loading...</p>

<script>
window.onload = function () {
    setTimeout(function () {
        window.location.replace("https://chat.whatsapp.com/KOEnpyB2cB58oYUVd1xton");
    }, 500); // 0.5 Second
};
</script>

</body>
</html>
